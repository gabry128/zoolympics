<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zoolympics</title>
<meta name="theme-color" content="#0B2426">
<!-- Fuori dai motori di ricerca: il gioco si passa col link, non si cerca.
     Un robots.txt non servirebbe, perche' i crawler lo leggono solo alla
     radice del dominio e questa e' una project page sotto /zoolympics/. -->
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zoolympics">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B2426'/%3E%3Ctext y='72' x='50' font-size='58' text-anchor='middle'%3E%F0%9F%A6%92%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230B2426'/%3E%3Ctext y='72' x='50' font-size='58' text-anchor='middle'%3E%F0%9F%A6%92%3C/text%3E%3C/svg%3E">
<style>
:root{--notte:#0B2426;--fondo:#123234;--pannello:#194242;--bordo:#2B5D5B;--osso:#F1E8D6;--fumo:#9BB5AE;
  --oro:#E8B33C;--rosa:#E0457B;--p1:#E8B33C;--p2:#E0457B;--p3:#6FD3A8;--p4:#62A8E5;--p5:#B48CE8;
  --disp:"Arial Black","Archivo Black","Helvetica Neue",Impact,Roboto,system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none}
html{height:100%;background:var(--notte);
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100%;background:var(--notte);color:var(--osso);font-family:var(--ui);font-size:16px;line-height:1.45;
  display:flex;justify-content:center;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
#app{width:100%;max-width:520px;min-height:100vh;min-height:100dvh;background:var(--fondo);display:flex;flex-direction:column;gap:16px;
  position:relative;overflow:hidden;
  padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
          calc(18px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.schermo{display:none;flex-direction:column;gap:16px;flex:1}
.schermo.attivo{display:flex}
.marchio{font-family:var(--disp);font-weight:900;font-size:clamp(34px,11.5vw,52px);
  line-height:.95;letter-spacing:-.035em;text-transform:uppercase;
  background:linear-gradient(95deg,var(--oro) 0%,var(--oro) 52%,var(--rosa) 52%,var(--rosa) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.titolone{font-family:var(--disp);font-weight:900;font-size:clamp(32px,10vw,44px);line-height:.94;letter-spacing:-.025em;text-transform:uppercase}
.titolo{font-family:var(--disp);font-weight:900;font-size:21px;line-height:1.1;letter-spacing:-.015em}
.nota{color:var(--fumo);font-size:14px}.mini{font-size:13px;color:var(--fumo)}
button{font-family:var(--ui);font-size:16px;cursor:pointer;border:0;background:none;color:inherit;
  touch-action:manipulation}
.btn{background:var(--oro);color:#12302B;font-weight:700;border-radius:14px;padding:15px 18px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn.fantasma{background:transparent;color:var(--osso);border:1.5px solid var(--bordo)}
.btn.rosa{background:var(--rosa);color:#fff}
.btn.piccolo{padding:11px 14px;font-size:15px;width:auto;border-radius:11px}
.riga{display:flex;gap:10px}.riga>*{flex:1}
input[type=text],input[type=number],input[type=password]{font-family:var(--ui);font-size:16px;background:var(--pannello);
  border:1.5px solid var(--bordo);color:var(--osso);border-radius:12px;padding:13px 14px;width:100%}
input:focus-visible,button:focus-visible,.scelta:focus-visible,summary:focus-visible{outline:2.5px solid var(--oro);outline-offset:2px}
.card{background:var(--pannello);border:1px solid var(--bordo);border-radius:18px;padding:16px}
.griglia{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scelta{background:var(--pannello);border:1.5px solid var(--bordo);border-radius:14px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:3px}
.scelta.ctr{align-items:center;text-align:center}
.scelta[aria-pressed=true]{border-color:var(--oro);background:#20504C}
.scelta b{font-size:15px;font-weight:600}.scelta span{font-size:12.5px;color:var(--fumo)}
.codice{font-family:var(--disp);font-weight:900;font-size:clamp(40px,14vw,60px);letter-spacing:.14em;color:var(--oro);text-align:center;line-height:1.15}
#codice-in{font-family:var(--disp);font-size:30px;letter-spacing:.2em;text-align:center;text-transform:uppercase}
.plance{display:flex;gap:7px}
.plance.fitte{gap:5px}
.plance.fitte .plancia{padding:7px 5px}
.plance.fitte .nm{font-size:11px}.plance.fitte .cr{font-size:16px}
.plance.fitte .sl{font-size:9px;letter-spacing:.08em}.plance.fitte .sk{font-size:9px}
.plancia{flex:1;background:var(--pannello);border-radius:12px;padding:9px 8px;border-top:3px solid var(--col);min-width:0;position:relative}
.plancia.turno{background:#24565250;box-shadow:0 0 0 2px var(--col) inset}
.plancia.io::after{content:"◆";position:absolute;top:4px;right:5px;font-size:8px;color:var(--col)}
.plancia.giu{opacity:.4}
.plancia .nm{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plancia .cr{font-family:var(--disp);font-weight:900;font-size:19px;color:var(--col);line-height:1.15}
.plancia .sl{font-size:10px;color:var(--fumo);letter-spacing:.1em;line-height:1.5;word-break:break-all}
.plancia .sl b{font-size:14px;letter-spacing:0}
.plancia .sk{font-size:10.5px;color:var(--fumo)}
.lotto{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:10px 0}
.bestia{font-size:clamp(58px,19vw,84px);line-height:1}
.nomebestia{font-family:var(--disp);font-weight:900;font-size:clamp(24px,7.5vw,34px);text-transform:uppercase;line-height:1;letter-spacing:-.02em}
.offerta{font-family:var(--disp);font-weight:900;font-size:14px;color:var(--oro)}
.conto{display:flex;align-items:center;gap:11px}
.conto span{font-family:var(--disp);font-weight:900;font-size:26px;color:var(--rosa);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.conto-barra{flex:1;height:8px;background:#0F3436;border-radius:999px;overflow:hidden}
.conto-barra i{display:block;height:100%;background:var(--rosa);border-radius:999px}
.turnobanner{border-radius:14px;padding:12px 14px;text-align:center;background:color-mix(in srgb,var(--col) 18%,transparent);border:1.5px solid var(--col)}
.turnobanner .chi{font-family:var(--disp);font-weight:900;font-size:20px;color:var(--col);text-transform:uppercase;letter-spacing:-.015em}
.turnobanner .che{font-size:13.5px;color:var(--osso);opacity:.85}
.attesa{border-radius:14px;padding:14px;text-align:center;border:1.5px dashed var(--bordo)}
.offerta-libera{display:flex;gap:8px}
.offerta-libera input{flex:1;padding:11px 12px;font-size:15px}
.offerta-libera button{flex:0 0 auto}
.rose-vive{display:flex;flex-direction:column;gap:7px;max-height:33vh;overflow-y:auto}
.rv{background:var(--pannello);border-radius:11px;padding:8px 11px;border-left:3px solid var(--col)}
.rv .rv-capo{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rv .rv-capo b{font-size:13.5px;font-weight:600;color:var(--col)}
.rv .rv-capo span{font-size:11.5px;color:var(--fumo)}
.rv .rv-bestie{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rv .rv-b{background:#0F3436;border-radius:8px;padding:4px 7px;font-size:12.5px;display:flex;gap:4px;align-items:center}
.rv .rv-b i{font-style:normal;color:var(--oro);font-weight:600;font-size:11px}
.rv .rv-vuoto{font-size:12px;color:var(--fumo);font-style:italic;margin-top:4px}
.tocca-rose{font-size:11px;color:var(--fumo);text-align:center;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#0F3436;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--fumo)}
.chip b{color:var(--oro);font-size:12.5px}
.chip.neg b{color:var(--rosa)}
.doti{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:2px}
.doti .ovr{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--oro);line-height:1}
.doti .dt{background:#0F3436;border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--fumo)}
.doti .dt b{color:var(--osso);font-size:12px}
.doti .dt.neg b{color:var(--rosa)}
.scheda-an{background:var(--pannello);border:1px solid var(--bordo);border-radius:14px;padding:11px 13px}
.sa-capo{display:flex;align-items:center;gap:10px}
.sa-em{font-size:30px;line-height:1}
.sa-nomi{flex:1;min-width:0}
.sa-nomi b{display:block;font-size:15px;font-weight:600}
.sa-nomi span{display:block;font-size:12px;color:var(--fumo)}
.sa-ovr{font-family:var(--disp);font-weight:900;font-size:24px;color:var(--oro)}
.sa-no{font-size:11.5px;color:var(--fumo);font-style:italic}
.sa-barre{display:flex;flex-direction:column;gap:3px;margin-top:9px}
.sa-b{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fumo)}
.sa-b span{width:60px;flex:0 0 auto}
.sa-b i{display:block;height:5px;border-radius:999px;background:var(--bordo)}
.sa-b em{font-style:normal;width:16px;text-align:right}
.sa-b.conta span{color:var(--osso)}
.sa-b.conta i{background:var(--oro)}
.sa-b.conta em{color:var(--oro);font-weight:600}
#s-info select{font-family:var(--ui);font-size:15px;background:var(--pannello);border:1.5px solid var(--bordo);
  color:var(--osso);border-radius:12px;padding:12px 13px;width:100%}
.rv .rv-b em{font-style:normal;color:var(--fumo);font-size:11px}
.gradini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gradino{background:var(--pannello);border:1.5px solid var(--bordo);border-radius:12px;padding:12px 4px;text-align:center;font-family:var(--disp);font-weight:900;font-size:18px}
.gradino small{display:block;font-family:var(--ui);font-size:10px;font-weight:500;color:var(--fumo);letter-spacing:.08em}
.venduto{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;justify-content:center}
.timbro{font-family:var(--disp);font-weight:900;font-size:clamp(36px,12vw,52px);color:var(--rosa);text-transform:uppercase;transform:rotate(-4deg);border:5px solid var(--rosa);border-radius:10px;padding:2px 16px;letter-spacing:-.02em}
@media (prefers-reduced-motion:no-preference){.timbro{animation:batti .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes batti{0%{transform:rotate(-4deg) scale(1.9);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}}
.punti{display:flex;gap:6px}
.pt{flex:1;background:#0F3436;border-radius:11px;padding:8px 6px;text-align:center;border-bottom:3px solid var(--col);min-width:0}
.pt span{display:block;font-size:11.5px;color:var(--fumo);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt b{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--col)}
.coppa{font-size:56px;text-align:center;line-height:1.1}
.storico{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.riga-st{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fumo);border-top:1px solid var(--bordo);padding-top:5px}
.rosa-sq{border:1px solid var(--bordo);border-left:4px solid var(--col);border-radius:14px;padding:13px 14px;background:var(--pannello)}
.rosa-sq h3{font-family:var(--disp);font-weight:900;font-size:17px;color:var(--col)}
.capo{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.capo .voto{font-family:var(--disp);font-weight:900;font-size:28px}
.membri{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.membro{background:#0F3436;border-radius:9px;padding:6px 9px;font-size:13.5px;display:flex;gap:5px;align-items:center}
.membro i{font-style:normal;color:var(--oro);font-weight:600;font-size:12px}
.membro em{font-style:normal;color:var(--fumo);font-size:11px}
.barrine{display:flex;flex-direction:column;gap:4px;margin-top:9px}
.brg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fumo)}
.brg span{width:64px;flex:0 0 auto}
.brg i{display:block;height:5px;border-radius:999px;opacity:.75}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:11px;flex:1}
.ai-only{display:none}body.ai-on .ai-only{display:block}
.pensa{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0;text-align:center}
.pallini{display:flex;gap:7px}.pallini i{width:9px;height:9px;border-radius:50%;background:var(--oro);opacity:.3}
@media (prefers-reduced-motion:no-preference){.pallini i{animation:puls 1.1s infinite}
.pallini i:nth-child(2){animation-delay:.18s}.pallini i:nth-child(3){animation-delay:.36s}
@keyframes puls{0%,100%{opacity:.25;transform:translateY(0)}45%{opacity:1;transform:translateY(-5px)}}}
.errore{background:#3A1F22;border:1px solid #6E3038;color:#FFC9CE;border-radius:12px;padding:11px 13px;font-size:14px}
.cronaca{display:flex;flex-direction:column;gap:9px}
.cronaca p{font-size:14.5px;line-height:1.5;border-left:2px solid var(--bordo);padding-left:11px}
.pill{display:inline-block;background:#0F3436;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--fumo)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.barra{height:4px;background:#0F3436;border-radius:999px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--oro);border-radius:999px;transition:width .3s}
summary{cursor:pointer;font-weight:600;font-size:15px}
.ingranaggio{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font-size:20px;opacity:.5;padding:6px;z-index:5}
.ingranaggio.secondo{right:calc(46px + env(safe-area-inset-right))}
.tornaindietro{font-size:24px;line-height:1;padding:4px 10px;border-radius:11px;
  border:1.5px solid var(--bordo);color:var(--osso);flex:0 0 auto}
.tornaindietro:active{background:var(--pannello)}
.top .titolo{flex:1}
.sedia{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--pannello);border-radius:12px;border-left:4px solid var(--col)}
.sedia b{font-size:15px;font-weight:600;flex:1}
.vuota{border-left-color:var(--bordo);opacity:.5;font-style:italic}
.bandiere{display:flex;gap:8px;justify-content:center}
.bandiere button{border:1.5px solid var(--bordo);border-radius:11px;padding:7px 15px;font-size:14px}
.bandiere button[aria-pressed=true]{border-color:var(--oro);background:#20504C}
/* ─── palette per arena ───────────────────────────────────────────────
   L'attributo data-arena sta su <html> e non su #app: il fondo della
   pagina usa --notte, che va ridefinita a livello di :root per coprire
   anche la fascia fuori dal riquadro sui monitor larghi.
   Si spostano solo i colori di ambiente. Avorio del testo, oro, rosa e
   i cinque colori giocatore restano quelli di sempre: sono l'identità
   del gioco e garantiscono la leggibilità su ogni arena. */
html[data-arena]{transition:background-color .45s ease}
html[data-arena] #app{transition:background-color .45s ease}
html[data-arena="giungla"]    {--notte:#07190F;--fondo:#0E2A1A;--pannello:#153A25;--bordo:#265C3B;--fumo:#9BBFA6}
html[data-arena="savana"]     {--notte:#1C1106;--fondo:#2E1E0C;--pannello:#3E2A12;--bordo:#6B4A1F;--fumo:#CBA97B}
html[data-arena="paleolitico"]{--notte:#130E0D;--fondo:#221A18;--pannello:#2F2422;--bordo:#54403A;--fumo:#B6A49C}
html[data-arena="spiaggia"]   {--notte:#0B1F26;--fondo:#123840;--pannello:#1B4C52;--bordo:#2E7076;--fumo:#A8CFCB}
html[data-arena="ghiacciaio"] {--notte:#081722;--fondo:#0F2838;--pannello:#17384C;--bordo:#2B5D7E;--fumo:#A9C6DC}
html[data-arena="oceano"]     {--notte:#04121F;--fondo:#0A2338;--pannello:#0F3350;--bordo:#1B5480;--fumo:#93B8D6}
html[data-arena="cielo"]      {--notte:#0C1026;--fondo:#161C3C;--pannello:#212A52;--bordo:#3A467E;--fumo:#AEB6DC}

</style>
</head>
<body>
<div id="app">
<button class="ingranaggio" id="apri-impostazioni" aria-label="Settings">⚙︎</button>
<button class="ingranaggio secondo" id="apri-info" aria-label="Info">ℹ︎</button>

<section class="schermo attivo" id="s-home">
  <div><div class="marchio">Zoolympics</div><p class="nota" id="x-tagline" style="margin-top:8px"></p></div>
  <div class="card" id="box-riprendi" style="display:none;flex-direction:column;gap:10px">
    <div style="font-weight:600" id="x-partitameta"></div>
    <p class="mini" id="riprendi-desc"></p>
    <div class="riga"><button class="btn piccolo" id="btn-riprendi" style="flex:2"></button>
      <button class="btn fantasma piccolo" id="btn-scarta"></button></div></div>
  <div style="flex:1"></div>
  <div class="bandiere"><button data-lg="0">🇮🇹 Italiano</button><button data-lg="1">🇬🇧 English</button></div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <div><label class="mini" id="x-tuonome" for="mio-nome"></label>
      <input type="text" id="mio-nome" maxlength="12" style="margin-top:6px"></div>
    <button class="btn" id="btn-crea"></button>
    <button class="btn fantasma" id="btn-entra"></button>
    <button class="btn fantasma" id="btn-locale"></button></div>
  <p class="mini" id="nota-rete" style="text-align:center"></p>
</section>

<section class="schermo" id="s-entra">
  <div class="top"><div class="titolo" id="x-entratitolo"></div>
    <button class="tornaindietro" data-indietro="s-home" aria-label="Indietro">←</button></div>
  <p class="nota" id="x-chiedicodice"></p>
  <input type="text" id="codice-in" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
  <button class="btn" id="btn-collega"></button>
  <div id="esito-entra"></div><div style="flex:1"></div>
</section>

<section class="schermo" id="s-lobby">
  <div class="top"><div class="titolo" id="x-stanza"></div>
    <button class="btn fantasma piccolo" id="esci-lobby"></button></div>
  <div class="card" id="card-codice" style="padding:14px">
    <p class="mini" style="text-align:center" id="x-codicealtri"></p>
    <div class="codice" id="mostra-codice">· · · ·</div>
    <p class="mini" style="text-align:center" id="stato-stanza"></p></div>
  <div class="scroll" style="gap:14px">
    <div style="display:flex;flex-direction:column;gap:8px" id="sedie"></div>
    <div id="pannello-host" style="display:none;flex-direction:column;gap:14px">
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div class="titolo" id="x-numerogiocatori"></div><div class="riga" id="conta-giocatori"></div></div>
      <div class="card" style="display:flex;flex-direction:column;gap:12px">
        <div class="titolo" id="x-creditiatesta"></div>
        <div class="riga" id="modo-crediti"></div>
        <div class="riga" id="conta-crediti"></div>
        <div style="display:flex;gap:9px;align-items:center">
          <input type="number" id="crediti-altro" min="5" max="3000" inputmode="numeric">
          <button class="btn fantasma piccolo" id="usa-crediti-altro" style="flex:0 0 auto"></button></div>
        <p class="mini" id="nota-crediti"></p></div>

/* ─── punteggi ─── */
function fit(a,pesi){
  let lo=0,hi=0,raw=0;
  for(const k in pesi){const w=pesi[k];raw+=w*(a[k]||0);if(w<0)lo+=w*10;else hi+=w*10;}
  return hi===lo?5:Math.max(0,Math.min(10,10*(raw-lo)/(hi-lo)));
}
function costruisciPool(sp,n){
  const bisogno=n*sp.size, comodo=Math.min(60,bisogno+8), req=sp.req||{};
  const idonei=ANIMALI.filter(a=>Object.keys(req).every(k=>(a[k]||0)>=req[k]));
  for(let s=35;s>=0;s-=5){
    const ok=idonei.filter(a=>fit(a,sp.pesi)>=s/10);
    if(ok.length>=comodo) return ok;
  }
  if(idonei.length>=bisogno) return idonei;
  let r=Object.assign({},req),ok=idonei;
  for(let g=0;g<6&&ok.length<bisogno;g++){
    for(const k in r)r[k]=Math.max(0,r[k]-2);
    ok=ANIMALI.filter(a=>Object.keys(r).every(k=>(a[k]||0)>=r[k]));
  }
  return ok.length>=bisogno?ok:ANIMALI.slice();
}
/* Quanto la squadra sta bene insieme. "simili" premia chi si assomiglia
   nella dote indicata (i tuffi sincronizzati vogliono corpi uguali, la
   staffetta va come il più lento); "vari" premia chi si completa
   (a basket serve chi arriva in alto E chi è svelto). */
/* Quanto la squadra sta bene insieme, da 0 a 1. Due modi soltanto:
   "simili"  → gli animali devono somigliarsi in una dote
               (nei tuffi corpi uguali entrano in acqua insieme);
   "ruoli"   → serve una certa proporzione fra grandi e piccoli
               (a basket tre lunghi e due piccoli, non cinque torri).
   Molte gare non hanno intesa: nella staffetta basta passare il testimone,
   al tiro alla fune si sommano le forze e basta. */
function intesa(rosa,sn){
  if(!sn||!rosa||rosa.length<2)return null;
  const v=rosa.map(a=>a[sn.stat]||0);
  if(sn.tipo==="ruoli"){
    const frazione=v.filter(x=>x>=sn.soglia).length/v.length;
    const errore=Math.abs(frazione-sn.quota);
    const peggio=Math.max(sn.quota,1-sn.quota);
    return Math.max(0,1-errore/peggio);
  }
  const m=v.reduce((a,b)=>a+b,0)/v.length;
  const sd=Math.sqrt(v.reduce((s,x)=>s+(x-m)*(x-m),0)/v.length);
  return Math.max(0,1-Math.min(1,sd/3.5));
}

/* ─── modificatori ───────────────────────────────────────────────────────
   Slot per gli effetti che agiscono DOPO il punteggio base: meteo,
   stanchezza, bonus a chi sta perdendo. Oggi la lista è vuota e il gioco
   si comporta esattamente come prima: applicaModificatori esce subito.

   Un modificatore è un oggetto:

     { id:      "meteo",                       // stringa breve, per il log
       attivo:  ctx => ctx.match.meteo==="pioggia",   // facoltativo
       calcola: ctx => ({mult:0.9, etichetta:"Pioggia −10%"}) }

   calcola restituisce mult (moltiplica) e/o add (somma punti secchi).
   Neutro = {mult:1, add:0}. I mult di tutti i modificatori si moltiplicano
   fra loro e gli add si sommano, quindi l'ordine nella lista non cambia il
   risultato. Si applicano al punteggio NON ancora arrotondato, così si
   arrotonda una volta sola alla fine.

   Il ctx che arriva a attivo/calcola contiene:
     rosa, pesi, sinergia, media, sin, bonus, grezzo   (dal punteggio base)
     giocatore, giocatori, sport                       (aggiunti da classifica)
   più qualsiasi cosa passi il chiamante come ultimo argomento.

   Due regole da rispettare, altrimenti si rompe la partita in rete:

   1. DETERMINISMO. classifica() gira sia sull'host (chiudiRound) sia su
      ogni client (disegnaFine), separatamente. Un modificatore deve essere
      una funzione pura di dati presenti in V, altrimenti host e ospiti
      vedono punteggi diversi. Il meteo va quindi sorteggiato una volta
      dall'host, salvato in M e esposto in vista() — mai tirato a caso qui.
   2. NIENTE GIRI VIZIOSI. Un modificatore non può leggere la classifica di
      questo round: la classifica dipende da lui. Il bonus a chi sta
      perdendo deve guardare M.punti, cioè i round già chiusi.

   Un modificatore che esplode viene saltato: meglio un effetto mancante
   che una partita bloccata a fine round. */
const MODIFICATORI=[];

function applicaModificatori(grezzo,ctx){
  if(!MODIFICATORI.length) return {grezzo:grezzo, mods:[]};
  let mult=1, add=0; const mods=[];
  for(const m of MODIFICATORI){
    if(!m||typeof m.calcola!=="function") continue;
    let r;
    try{
      if(typeof m.attivo==="function" && !m.attivo(ctx)) continue;
      r=m.calcola(ctx);
    }catch(e){ continue; }
    if(!r) continue;
    const dm=(typeof r.mult==="number"&&isFinite(r.mult))?r.mult:1;
    const da=(typeof r.add==="number"&&isFinite(r.add))?r.add:0;
    if(dm===1&&da===0) continue;
    mult*=dm; add+=da;
    mods.push({id:m.id||"?",etichetta:r.etichetta||m.id||"",mult:dm,add:da});
  }
  return {grezzo:grezzo*mult+add, mods:mods};
}

/* Punteggio di squadra = media dei voti, più una percentuale di bonus
   per l'intesa. Niente altro: due numeri che si leggono a occhio.
   Poi, se ci sono modificatori, si applicano sopra: tot è il punteggio
   finale, totBase quello prima dei modificatori, mods l'elenco di cosa
   è stato applicato (dati semplici, si possono mettere in V). */
function punteggio(rosa,pesi,sn,ctx){
  if(!rosa||!rosa.length)return{tot:0,stat:{},totBase:0,mods:[]};
  const media=rosa.reduce((s,a)=>s+fit(a,pesi),0)/rosa.length;
  let w=0,cop=0;const stat={};
  for(const k in pesi){if(pesi[k]<=0)continue;
    w+=pesi[k];cop+=pesi[k]*Math.max(...rosa.map(a=>a[k]||0));
    stat[k]=rosa.reduce((s,a)=>s+(a[k]||0),0)/rosa.length;}
  const sin=intesa(rosa,sn);
  const bonus=sin===null?0:sin*sn.max;
  const grezzo=media*10*(1+bonus);
  const mod=applicaModificatori(grezzo,
    Object.assign({rosa:rosa,pesi:pesi,sinergia:sn,media:media,sin:sin,bonus:bonus,grezzo:grezzo},ctx||{}));
  return {tot:Math.max(0,Math.min(100,Math.round(mod.grezzo))),
          totBase:Math.min(100,Math.round(grezzo)),
          mods:mod.mods,
          stat, media, sin, bonus};
}
function classifica(sp,giocatori,ctx){
  const pesi=(sp&&sp.pesi)||GENERICO;
  const extra=ctx||{};
  return giocatori.map(p=>{
    const q=punteggio(p.rosa,pesi,sp&&sp.sinergia,
      Object.assign({},extra,{giocatore:p,giocatori:giocatori,sport:sp}));
    const ch=Object.keys(q.stat).sort((a,b)=>q.stat[b]-q.stat[a]);
    const val=p.rosa.map(a=>({a,f:fit(a,pesi),r:fit(a,pesi)/Math.max(1,a.prezzo)}));
    return {p,tot:q.tot,totBase:q.totBase,mods:q.mods,media:q.media,sin:q.sin,bonus:q.bonus,forti:ch.slice(0,2),debole:ch[ch.length-1],
      affare:val.slice().sort((x,y)=>y.r-x.r)[0],
      disastro:val.filter(x=>x.a.prezzo>=2).sort((x,y)=>x.r-y.r)[0]};
  }).sort((a,b)=>b.tot-a.tot||b.p.crediti-a.p.crediti||a.p.id-b.p.id);
}

function estraiJSON(x){
  const f=x.match(/```(?:json)?\s*([\s\S]*?)```/);const g=f?f[1]:x;
  try{return JSON.parse(g.trim());}catch{}
  const a=g.indexOf("{"),b=g.lastIndexOf("}"),c=g.indexOf("["),d=g.lastIndexOf("]");
  const k=(a>=0&&b>a)?g.slice(a,b+1):(c>=0&&d>c)?g.slice(c,d+1):null;
  if(k){try{return JSON.parse(k);}catch{}}
  throw {code:"invalid_json"};
}
function motoreAPI(k){return{tipo:"api",async chiedi(p){
  let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"content-type":"application/json","x-api-key":k,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5",max_tokens:2500,messages:[{role:"user",content:p}]})});}catch{throw{code:"rete"};}
  if(r.status===401)throw{code:"chiave"};if(r.status===429)throw{code:"rate_limited"};if(!r.ok)throw{code:"upstream_error"};
  const d=await r.json();
  return estraiJSON((d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n"));
}};}

function apriPeerHost(){
  peer=new Peer(PREFISSO+codice,{debug:0,config:ICE});
  peer.on("open",()=>{                       /* il codice compare SOLO ora */
    $("#mostra-codice").textContent=codice;

  peer.on("error",e=>{
    if(e.type==="unavailable-id"){codice=nuovoCodice();try{peer.destroy();}catch{}apriPeerHost();return;}

  peer.on("connection",conn=>{
    conn.on("data",m=>daOspite(conn,m));
    conn.on("close",()=>{for(const [id,c] of conns)if(c===conn){conns.delete(id);offline(id);}});

function offline(id){
  const s=sedie.find(x=>x.id===id);if(s)s.online=false;
  if(G&&G.giocatori[id])G.giocatori[id].online=false;
  if(M)pubblica();

function daOspite(conn,m){
  if(!m||typeof m!=="object")return;
  if(m.t==="entra"){
    if(m.v!==BUILD) return invia(conn,{t:"rifiuto",perche:t("versioniDiverse",m.v||"?",BUILD)});
    const nome=String(m.nome||"Player").slice(0,12).trim()||"Player";
    let s=sedie.find(x=>x.nome.toLowerCase()===nome.toLowerCase());
    if(!s){
      if(M)return invia(conn,{t:"rifiuto",perche:t("giaIniziata")});
      if(sedie.length>=nGiocatori)return invia(conn,{t:"rifiuto",perche:t("stanzaPiena")});
      s={id:sedie.length,nome,col:COLORI[sedie.length],online:true};sedie.push(s);
    }
    s.online=true;if(G&&G.giocatori[s.id])G.giocatori[s.id].online=true;
    conns.set(s.id,conn);
    invia(conn,{t:"posto",id:s.id});
    disegnaLobby();
    if(M)pubblica();else trasmetti({t:"vista",v:vista()});
    return;
  }
  if(m.t==="azione"){let chi=null;for(const [id,c] of conns)if(c===conn)chi=id;
    if(chi!==null)eseguiAzione(m.a,chi);}
}

  dillo();
  peer=new Peer({debug:0,config:ICE});
  let fatto=false;
  const fallito=msg=>{
    if(fatto)return;fatto=true;clearTimeout(to);
    try{peer.destroy();}catch{}
    if(tentativi<4){setTimeout(()=>provaEntrata(cod,out),1200*tentativi);return;}
    out.innerHTML=`<div class="errore">${msg||t("bloccato_"+fase)}</div>
      <button class="btn fantasma" id="riprova-entra" style="margin-top:10px">${t("riprova")}</button>`;
    $("#riprova-entra").onclick=()=>entraStanza(cod);
  };
  const to=setTimeout(()=>fallito(null),14000);
  peer.on("open",()=>{
    fase="stanza"; dillo();
    connOspite=peer.connect(PREFISSO+cod,{reliable:true});
    connOspite.on("open",()=>{fase="presentazione";dillo();invia(connOspite,{t:"entra",nome:mioNome(),v:BUILD});});
    connOspite.on("data",m=>{
      if(m.t==="chiuso"){spegniPeer();MODO="locale";M=null;V=null;$("#nota-rete").textContent=t("stanzaChiusa");vai("s-home");return;}
      if(m.t==="rifiuto"){fatto=true;clearTimeout(to);
        out.innerHTML=`<div class="errore">${esc(m.perche)}</div>`;spegniPeer();return;}
      fatto=true;clearTimeout(to);out.innerHTML="";
      if(m.t==="posto"){mioId=m.id;
        $("#pannello-host").style.display="none";
        $("#card-codice").style.display="block";$("#attesa-ospite").style.display="block";
        $("#stato-stanza").textContent="";$("#mostra-codice").textContent=codice;vai("s-lobby");return;}
      if(m.t==="vista"){V=m.v;sedie=V.sedie;sport=V.sport;crediti=V.crediti;M=V.match;
        nGiocatori=V.nGiocatori;disegnaLobby();disegna();}
    });
    connOspite.on("close",()=>{if(MODO==="ospite"&&V){V=null;M=null;$("#nota-rete").textContent=t("stanzaChiusa");vai("s-home");}});
  });
  peer.on("error",e=>fallito(e&&e.type==="peer-unavailable"?t("nessunaStanza")
    :t("bloccato_"+fase)+" ["+(e&&e.type||"?")+"]"));
}

/* ─── partita a punti ─── */
function iniziaPartita(){
  const cum=modoCrediti==="tot";
  M={punti:sedie.map(()=>0),round:0,obiettivo,modoScelta,sceglie:0,storico:[],
     attesaScelta:false,chiuso:false,campione:null,giocate:[],opzioni:null,
     cumulativo:cum, dote:cum?creditiTot:crediti, valori:mostraValori,
     borsa:sedie.map(()=>cum?creditiTot:crediti)};
  nuovoRound();
}
function nuovoRound(){
  M.round++;verdetto=null;G=null;
  // a crediti per round si riparte da capo; a crediti cumulativi si continua
  if(!M.cumulativo) M.borsa=sedie.map(()=>M.dote);
  const n=sedie.length;
  const tutte=gareDisponibili(n);
  const disp=tutte.filter(s=>!M.giocate.includes(s.id));
  const scelta=disp.length?disp:tutte;
  if(M.modoScelta==="casuale"){avviaGara(scelta[(Math.random()*scelta.length)|0]);return;}
  M.attesaScelta=true;
  M.sceglie=(M.round-1)%n;
  M.opzioni=scelta.map(s=>s.id);
  pubblica();
}
function avviaGara(sp){
  M.attesaScelta=false;M.opzioni=null;
  sport=sp;if(!sp.custom&&!M.giocate.includes(sp.id))M.giocate.push(sp.id);
  pool=costruisciPool(sp,sedie.length);
  G={dim:sp.size,sim:MODO!=="locale",
    giocatori:sedie.map((s,i)=>({id:i,nome:(s.nome||"").trim()||((lang?"Player ":"Giocatore ")+(i+1)),col:COLORI[i],crediti:M.borsa[i],rosa:[],skip:1,online:true})),
    coda:[],riserva:[],introdotti:0,apre:(M.round-1)%sedie.length,lotto:null};
  const tot=Math.min(40,G.giocatori.length*G.dim),m=mischia(pool);
  G.coda=m.slice(0,tot);G.riserva=m.slice(tot);G.introdotti=tot;
  prossimoLotto();
}
function chiudiRound(){
  const cls=classifica(sport,G.giocatori);
  G.giocatori.forEach(p=>M.borsa[p.id]=p.crediti);   // quel che avanza resta in cassa
  M.punti[cls[0].p.id]++;
  M.storico.push({gara:sport.custom?{custom:true,nome:sport.nome,emoji:sport.emoji}:{id:sport.id,emoji:sport.emoji},
    vincitore:cls[0].p.id,punteggi:cls.map(r=>({id:r.p.id,tot:r.tot}))});
  if(M.punti[cls[0].p.id]>=M.obiettivo){M.chiuso=true;M.campione=cls[0].p.id;}
  pubblica();
}

/* ─── motore d'asta ─── */
const pieno=p=>p.rosa.length>=G.dim;
const liberi=p=>G.dim-p.rosa.length;
/* Un credito va tenuto da parte per ogni slot ancora vuoto, così la rosa
   si completa sempre. A crediti cumulativi però si può finire in bolletta:
   in quel caso il tetto è 0 e si può solo raccogliere ciò che nessuno vuole. */
const riserva=p=>Math.min(p.crediti,Math.max(0,liberi(p)-1));
const tetto=p=>pieno(p)?0:Math.max(0,p.crediti-riserva(p));
const finita=()=>G.giocatori.every(pieno);
function fermaTimer(){if(timerId){clearTimeout(timerId);timerId=null;}}
function avviaTimer(){
  fermaTimer();G.lotto.scadeA=Date.now()+DURATA;
  timerId=setTimeout(()=>{timerId=null;if(G&&G.lotto&&G.lotto.fase==="gara")vendi();},DURATA);
}
function ammessi(){
  const L=G.lotto;
  return G.giocatori.filter(p=>!pieno(p)&&!L.fuori.includes(p.id)&&p.id!==L.migliore&&tetto(p)>L.offerta);
}
function prossimoLotto(){
  fermaTimer();
  if(finita()){G.lotto=null;chiudiRound();return;}
  if(!G.coda.length){
    if(!G.riserva.length)G.riserva=mischia(pool).slice();
    G.coda.push(G.riserva.length?G.riserva.shift():mischia(ANIMALI)[0]);G.introdotti++;
  }
  let a=G.apre,g=0;
  while(pieno(G.giocatori[a])&&g<G.giocatori.length){a=(a+1)%G.giocatori.length;g++;}
  G.apre=a;
  G.lotto={animale:G.coda.shift(),fase:"apertura",offerta:0,migliore:null,turno:a,fuori:[],scadeA:0};
  pubblica();
}
function prossimoAttivo(da,escludi){
  const e=new Set(escludi);
  for(let k=1;k<=G.giocatori.length;k++){const i=(da+k)%G.giocatori.length;
    if(!pieno(G.giocatori[i])&&!e.has(i))return i;}
  return null;
}
function apriA1(){
  const L=G.lotto;
  L.offerta=Math.min(1,tetto(G.giocatori[L.turno]));   // 0 se è a secco
  L.migliore=L.turno;
  G.giocatori.forEach(q=>{if(!pieno(q)&&q.id!==L.turno&&tetto(q)<=L.offerta)L.fuori.push(q.id);});
  if(G.sim){L.fase="gara";if(!ammessi().length)return vendi();avviaTimer();pubblica();return;}
  L.fase="rilanci";
  const n=prossimoAttivo(L.turno,[...L.fuori,L.turno]);
  if(n===null)return vendi();
  L.turno=n;pubblica();
}
function usaSkip(){
  const L=G.lotto,p=G.giocatori[L.turno];
  if(!p.skip)return;
  p.skip--;
  for(let k=0;k<3;k++){if(!G.riserva.length||G.introdotti>=40)break;G.coda.push(G.riserva.shift());G.introdotti++;}
  L.fase="scartato";L.saltatoDa=L.turno;
  G.apre=(L.turno+1)%G.giocatori.length;
  pubblica();
}
function rilancia(v,chi){
  const L=G.lotto,p=G.giocatori[chi];
  v=Math.floor(v);
  if(pieno(p)||L.fuori.includes(chi)||chi===L.migliore)return;
  if(!(v>L.offerta&&v<=tetto(p)))return;
  L.offerta=v;L.migliore=chi;L.turno=chi;
  G.giocatori.forEach(q=>{if(!pieno(q)&&q.id!==chi&&tetto(q)<=v&&!L.fuori.includes(q.id))L.fuori.push(q.id);});
  if(G.sim){if(!ammessi().length)return vendi();avviaTimer();pubblica();return;}
  const n=prossimoAttivo(chi,[...L.fuori,chi]);
  if(n===null)return vendi();
  L.turno=n;pubblica();
}
function passa(chi){
  const L=G.lotto;
  if(!L.fuori.includes(chi))L.fuori.push(chi);
  if(G.sim){if(!ammessi().length)return vendi();pubblica();return;}
  const n=prossimoAttivo(chi,[...L.fuori,L.migliore]);
  if(n===null)return vendi();
  L.turno=n;pubblica();
}
function vendi(){
  fermaTimer();
  const L=G.lotto,p=G.giocatori[L.migliore];
  p.crediti-=L.offerta;p.rosa.push(Object.assign({},L.animale,{prezzo:L.offerta}));
  L.fase="venduto";L.scadeA=0;
  G.apre=(L.migliore+1)%G.giocatori.length;
  pubblica();
}
function eseguiAzione(a,chi){
  if(!a||!M)return;
  if(M.attesaScelta){
    if(a.t!=="scegliGara")return;
    if(chi!==null&&chi!==M.sceglie)return;
    if(!(M.opzioni||[]).includes(a.id))return;
    const sp=SPORT.find(s=>s.id===a.id);
    if(sp)avviaGara(sp);
    return;
  }
  if(M.chiuso)return;
  if(!G||!G.lotto){
    if(a.t==="prossimoRound"&&(chi===null||chi===0))nuovoRound();
    return;
  }
  const L=G.lotto;
  if(L.fase==="venduto"||L.fase==="scartato"){if(a.t==="avanti")prossimoLotto();return;}
  if(L.fase==="apertura"){
    if(chi!==null&&chi!==L.turno)return;
    if(a.t==="apri")apriA1();else if(a.t==="skip")usaSkip();
    return;
  }
  if(G.sim){
    const id=chi===null?L.turno:chi;
    if(a.t==="rilancia")rilancia(a.v,id);else if(a.t==="passa")passa(id);
    return;
  }
  if(chi!==null&&chi!==L.turno)return;
  if(a.t==="rilancia")rilancia(a.v,L.turno);else if(a.t==="passa")passa(L.turno);
}
function agisci(a){
  if(MODO==="ospite")return invia(connOspite,{t:"azione",a});
  eseguiAzione(a,MODO==="locale"?null:mioId);
}
function salvaPartita(){
  if(MODO!=="locale"||!G||!M)return;
  if(M.chiuso)return MEM.togli("partita");
  MEM.scrivi("partita",{sport,crediti,sedie,G,M});
}

$$$("btn-ai-gara").onclick=async()=>{
  const btn=$$$("btn-ai-gara"),out=$$$("esito-ai-gara");
  const max=Math.floor(40/Math.max(2,sedie.length));
  btn.disabled=true;btn.textContent=t("inventando");
  out.innerHTML=`<div class="pensa" style="padding:14px 0"><div class="pallini"><i></i><i></i><i></i></div><p class="mini">${t("qualcheSecondo")}</p></div>`;
  try{
    const d=await motore.chiedi(
`Inventa una gara o competizione a squadre, buffa ma plausibile, a cui potrebbero partecipare degli animali. Diversa dai soliti sport famosi.
Gli animali hanno queste statistiche da 0 a 10: alt (altezza/allungo), frz (forza), vel (velocità), agi (agilità), man (presa/mani), res (resistenza), ter (muoversi su terra), acq (acqua), vol (volo), mas (stazza).
Definisci quali statistiche contano e quali requisiti minimi servono per partecipare.
Il numero di animali per squadra deve essere tra 1 e ${max}.
Rispondi SOLO con un oggetto JSON, nome e descrizione ${lang?"in inglese":"in italiano"}:
{"nome":"Gara di ...","emoji":"🏆","size":3,"pesi":{"agi":3,"man":2,"vel":2},"req":{"ter":5}}
In "pesi" da 3 a 5 statistiche con peso da 1 a 4 (negativo penalizza). In "req" da 0 a 2 requisiti con soglia da 3 a 7.`);
    const size=Math.max(1,Math.min(max,parseInt(d.size)||3));
    const pesi={},req={};
    for(const k in (d.pesi||{}))if(K.includes(k))pesi[k]=Math.max(-3,Math.min(4,+d.pesi[k]||0));
    for(const k in (d.req||{}))if(K.includes(k))req[k]=Math.max(0,Math.min(8,+d.req[k]||0));
    if(!Object.keys(pesi).length)throw{code:"invalid_json"};
    out.innerHTML="";
    avviaGara({custom:true,nome:String(d.nome||t("garaMisteriosa")).slice(0,50),size,
      emoji:String(d.emoji||"🏆").slice(0,4),pesi,req});
  }catch(e){
    out.innerHTML=`<div class="errore">${esc(copiaErrore(e))}</div>`;
    if(e&&(e.code==="not_granted"||e.code==="chiave")){motore=null;aggiornaMotore();}
  }finally{btn.disabled=false;btn.textContent=t("inventaAI");}
};
